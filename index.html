<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keepsake</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body
  data-cloud-name="deu8plkph"
  data-upload-preset="keepsake-test"
  data-max-file-size-mb="100"
>
  <main class="page-shell py-4 py-md-5">
    <div class="container">
      <div class="row justify-content-center g-4">
        <div id="state-countdown" class="col-12 col-xl-8 state-panel d-none" data-state="countdown">
          <section class="card-surface p-4 p-md-5 text-center">
            <p class="eyebrow mb-2">Keepsake</p>
            <h1 class="display-6 fw-semibold mb-3">Countdown</h1>
            <p class="lead intro-copy mb-0">
              Countdown state is active. The upload section will appear when the event opens.
            </p>
          </section>
        </div>

        <div id="state-upload" class="col-12 col-xl-10 state-panel d-none" data-state="upload">
          <section class="card-surface p-4 p-md-5 mb-4">
            <p id="upload-event-title" class="eyebrow mb-2">Keepsake</p>
            <div class="row g-4 align-items-start">
              <div class="col-12 col-lg-7">
                <h1 class="display-6 fw-semibold mb-3">Upload photos and videos</h1>
              </div>
              <div class="col-12 col-lg-5">
                <div class="info-panel h-100">
                  <p class="small-label mb-2">Upload Status</p>
                  <div class="d-flex justify-content-between align-items-center gap-3">
                    <span class="text-secondary-light">Uploads used</span>
                    <span id="upload-count" class="badge text-bg-light count-pill">0 / 10</span>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="card-surface p-4">
            <div class="row g-4">
              <div class="col-12">
                <h2 class="h4 mb-3">Upload Media</h2>
                <form id="upload-form" novalidate>
                  <div class="mb-3">
                    <label for="media-file" class="form-label">Choose an image or video</label>
                    <input
                      id="media-file"
                      name="media"
                      class="form-control"
                      type="file"
                      accept="image/*,video/*"
                      required
                    >
                    <div id="upload-help-text" class="form-text">Images and videos only.</div>
                  </div>

                  <div class="d-grid">
                    <button id="upload-button" type="submit" class="btn btn-primary btn-lg px-4">
                      Upload to Cloudinary
                    </button>
                  </div>

                  <p id="status" class="status-message mt-3 mb-0" aria-live="polite"></p>
                </form>
              </div>
            </div>
          </section>
        </div>

        <div id="state-gallery" class="col-12 col-xl-8 state-panel d-none" data-state="gallery">
          <section class="card-surface p-4 p-md-5 text-center">
            <p class="eyebrow mb-2">Keepsake</p>
            <h1 class="display-6 fw-semibold mb-3">Gallery</h1>
            <p class="lead intro-copy mb-0">
              Gallery state is active. Uploads are closed.
            </p>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="media.js"></script>
  <script src="script.js"></script>
</body>
</html>
