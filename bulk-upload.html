<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keepsake Bulk Upload</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body data-cloud-name="deu8plkph" data-upload-preset="keepsake-test" data-max-file-size-mb="100">
  <main class="page-shell py-4 py-md-5">
    <div class="container">
      <div class="row justify-content-center g-4">
        <div class="col-12 col-xl-10">
          <section class="card-surface p-4 p-md-5 mb-4">
            <p class="eyebrow mb-2">Keepsake</p>
            <div class="row g-4 align-items-end">
              <div class="col-12 col-lg-7">
                <h1 class="display-6 fw-semibold mb-2">Bulk upload</h1>
              </div>
              <div class="col-12 col-lg-5">
                <div class="info-panel h-100">
                  <p class="small-label mb-2">Batch Status</p>
                  <div class="bulk-summary-grid">
                    <span>Selected</span>
                    <strong id="bulk-selected-count">0</strong>
                    <span>Uploaded</span>
                    <strong id="bulk-uploaded-count">0</strong>
                    <span>Failed</span>
                    <strong id="bulk-failed-count">0</strong>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="card-surface p-4">
            <form id="bulk-upload-form" novalidate>
              <div class="row g-4">
                <div class="col-12 col-lg-5">
                  <label for="bulk-uploader-name" class="form-label">Upload name</label>
                  <input id="bulk-uploader-name" class="form-control" type="text" autocomplete="off"
                    placeholder="Photobooth" required>
                  <div class="form-text">Used for the gallery label and storage folder.</div>
                </div>

                <div class="col-12 col-lg-7">
                  <label for="bulk-media-files" class="form-label">Choose images or videos</label>
                  <input id="bulk-media-files" class="form-control" type="file" accept="image/*,video/*,.mov" multiple
                    required>
                  <div id="bulk-help-text" class="form-text">Images and videos only.</div>
                </div>

                <div class="col-12">
                  <div class="progress bulk-progress" role="progressbar" aria-label="Bulk upload progress"
                    aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div id="bulk-progress-bar" class="progress-bar" style="width: 0%"></div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="d-flex flex-column flex-sm-row gap-3">
                    <button id="bulk-upload-button" type="submit" class="btn btn-primary btn-lg px-4">
                      Upload Media
                    </button>
                    <button id="bulk-clear-button" type="button" class="btn btn-outline-light btn-lg px-4">
                      Clear
                    </button>
                  </div>
                  <p id="bulk-status" class="status-message mt-3 mb-0" aria-live="polite"></p>
                </div>

                <div class="col-12">
                  <div id="bulk-file-list" class="bulk-file-list"></div>
                </div>
              </div>
            </form>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="bulk-upload.js"></script>
</body>

</html>
